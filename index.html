<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Kim</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="mk-page">
    <header class="mk-header">
        <nav class="mk-nav" aria-label="Main">
            <ul class="mk-nav-links mk-nav-left">
                <li><a href="index.html">Home</a></li>
                <li><a href="me.html">About</a></li>
                <li><a href="products.html">practice book</a></li>
            </ul>

            <a class="mk-logo" href="index.html">Hana Kim</a>

            <ul class="mk-nav-links mk-nav-right">
                <li><a href="javascript.html">My Designs</a></li>
                <li><a href="forEach.html">Reference</a></li>
                <li><a href="search.html" class="mk-search">Search</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="mk-hero">
            <div class="mk-hero-slides" aria-label="Featured fashion photography">
                <img
                    src="images/fashion-runway.png"
                    alt="Models walking on a fashion runway in black and neutral tones"
                    class="mk-hero-slide mk-hero-slide--1 is-active"
                    data-slide="1"
                >
                <img
                    src="images/fashion-runway-2.png"
                    alt="Model walking on a white runway in black heels and a silver skirt"
                    class="mk-hero-slide mk-hero-slide--2"
                    data-slide="2"
                >
            </div>
            <div class="mk-hero-center">
                <p class="mk-hero-center-name">Hana Kim</p>
                <p class="mk-hero-center-tagline">Portfolio</p>
                <p class="mk-hero-center-tagline mk-hero-center-tagline--sub">Creative journey</p>
            </div>
        </section>
    </main>

    <footer class="mk-footer">
        <div class="mk-footer-brand">Hana Kim</div>
        <nav class="mk-footer-nav" aria-label="Footer">
            <a href="index.html">Home</a>
            <a href="me.html">About</a>
            <a href="products.html">practice book</a>
            <a href="javascript.html">My Designs</a>
        </nav>
        <p class="mk-footer-copy">&copy; Hana Kim 2026</p>
    </footer>

    <script>
        (function () {
            var slides = Array.prototype.slice.call(document.querySelectorAll(".mk-hero-slide"));
            if (!slides.length) return;

            var current = 0;
            var timer;

            function showSlide(index) {
                current = (index + slides.length) % slides.length;

                slides.forEach(function (slide, i) {
                    slide.classList.toggle("is-active", i === current);
                });
            }

            function nextSlide() {
                showSlide(current + 1);
            }

            function startTimer() {
                stopTimer();
                timer = window.setInterval(nextSlide, 4000);
            }

            function stopTimer() {
                if (timer) {
                    window.clearInterval(timer);
                    timer = null;
                }
            }

            showSlide(0);
            startTimer();
        })();
    </script>
</body>

</html>
